name: Fetch artist photos

# Run by hand from the Actions tab to download missing artist photos from Deezer.
# It also runs by itself when photos are uploaded to images/artists/, to tidy the
# names of era photos ("Carrie Underwood 2016.jpg") and rebuild _years.json.
on:
  workflow_dispatch:
    inputs:
      redo:
        description: 'Download these again, comma separated (e.g. Ronnie Dunn, Maddie & Tae)'
        required: false
        default: ''
      wiki:
        description: 'Take these from Wikipedia instead of Deezer, comma separated'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'images/artists/**'
      - '!images/artists/_years.json'
      - '!images/artists/_matches.csv'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch'
        run: python3 tools/fetch_artist_photos.py --redo "$REDO" --wiki "$WIKI"
        env:
          REDO: ${{ inputs.redo }}
          WIKI: ${{ inputs.wiki }}
      - if: github.event_name == 'push'
        run: python3 tools/fetch_artist_photos.py --index-only
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/artists
          git diff --cached --quiet || git commit -m "Update artist photos"
          git push
