name: Fetch artist photos

# Run by hand from the Actions tab. Downloads any missing artist photos
# from Deezer into images/artists/ and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_artist_photos.py
      - name: Commit new photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/artists
          git diff --cached --quiet || git commit -m "Add artist photos from Deezer"
          git push
