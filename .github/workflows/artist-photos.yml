name: Fetch artist photos

# Run by hand from the Actions tab to download missing artist photos from Deezer,
# or (with "covers" ticked) album and single covers for the awards.
# It also runs by itself when photos or covers are uploaded, to tidy the names of
# era photos ("Carrie Underwood 2016.jpg") and covers ("Carly Pearce - Hummingbird.jpg").
on:
  workflow_dispatch:
    inputs:
      redo:
        description: 'Download these again, comma separated (e.g. Ronnie Dunn, or "Carly Pearce - Hummingbird" for covers)'
        required: false
        default: ''
      wiki:
        description: 'Take these artist photos from Wikipedia instead of Deezer, comma separated'
        required: false
        default: ''
      covers:
        description: 'Fetch album and single covers instead of artist photos'
        type: boolean
        default: false
      all_songs:
        description: 'With covers: also every song that has charted (slow)'
        type: boolean
        default: false
      pop_albums:
        description: 'Instead: find the album each Pop 10 song comes from (pop_album_matches.json)'
        type: boolean
        default: false
      previews:
        description: 'Instead: match each song to a Deezer track for 30-second previews (previews.json)'
        type: boolean
        default: false
      info:
        description: 'Instead: look up each act on Wikidata (person or group, birth date) for the Ask page'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'images/artists/**'
      - 'images/covers/**'
      - '!images/artists/_years.json'
      - '!images/artists/_matches.csv'
      - '!images/covers/_matches.csv'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the newest of two uploads for one photo wins
      - run: mkdir -p probe && curl -sfo probe/cur.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/f0/de/66/f0de661c-299a-b7ae-80d9-4f35f79875b1/mzaf_10598240417031133475.plus.aac.p.m4a' && curl -sfo probe/dlx.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/5c/0c/db/5c0cdbf6-be9c-bb77-fe07-45e06f0a43f2/mzaf_7382454857229752678.plus.aac.p.m4a' && curl -sfo probe/piano.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/fd/dc/87/fddc87b5-2883-257a-e79e-d72a8dc16401/mzaf_17790980896663750916.plus.aac.p.m4a' && curl -sfo probe/wdta.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/a9/05/42/a905420d-535d-e9f7-7885-b8e9c9831b70/mzaf_930790171806791983.plus.aac.p.m4a' && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add probe && git commit -m probe-audio && git push; exit 1
      - if: github.event_name == 'workflow_dispatch' && inputs.info
        run: python3 tools/fetch_artist_info.py
      - if: github.event_name == 'workflow_dispatch' && inputs.pop_albums
        # Stops in time to commit what it found; run again for the rest
        run: python3 tools/fetch_pop_albums.py --minutes 100 --redo "$REDO"
        env:
          REDO: ${{ inputs.redo }}
      - if: github.event_name == 'workflow_dispatch' && inputs.previews
        # Stops in time to commit what it found; run again for the rest
        run: python3 tools/fetch_previews.py --minutes 100 --redo "$REDO"
        env:
          REDO: ${{ inputs.redo }}
      - if: github.event_name == 'workflow_dispatch' && !inputs.covers && !inputs.info && !inputs.pop_albums && !inputs.previews
        run: python3 tools/fetch_artist_photos.py --redo "$REDO" --wiki "$WIKI"
        env:
          REDO: ${{ inputs.redo }}
          WIKI: ${{ inputs.wiki }}
      - if: github.event_name == 'workflow_dispatch' && inputs.covers
        # Stops in time to commit what it found; run again for the rest
        run: python3 tools/fetch_covers.py --minutes 100 --redo "$REDO" ${{ inputs.all_songs && '--all-songs' || '' }}
        env:
          REDO: ${{ inputs.redo }}
      - if: github.event_name == 'push'
        run: |
          python3 tools/fetch_artist_photos.py --index-only
          python3 tools/fetch_covers.py --tidy-only
      - name: Find faces in new photos
        # So square tiles crop around the face (images/artists/focus.json)
        if: ${{ !inputs.covers && !inputs.info && !inputs.pop_albums && !inputs.previews }}
        run: |
          pip install -q "opencv-python-headless<5"
          python3 tools/find_faces.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images
          for f in artist_info.json artist_info_missing.txt pop_album_matches.json previews.json preview_picks.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Update artist photos and covers"
          # main may have moved during a long run
          git pull --rebase origin main
          git push
