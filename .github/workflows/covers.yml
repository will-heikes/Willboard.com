name: Fetch covers

# Run by hand from the Actions tab to download album and single covers for the
# awards (and every chart song if asked). It also runs by itself when covers are
# uploaded to images/covers/, to rename "<Artist> - <Title>.jpg" uploads.
on:
  workflow_dispatch:
    inputs:
      all_songs:
        description: 'Also fetch covers for every song that has charted (slow)'
        type: boolean
        default: false
      redo:
        description: 'Fetch these again, comma separated as "Artist - Title"'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'images/covers/**'
      - '!images/covers/_matches.csv'

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch'
        run: python3 tools/fetch_covers.py --redo "$REDO" ${{ inputs.all_songs && '--all-songs' || '' }}
        env:
          REDO: ${{ inputs.redo }}
      - if: github.event_name == 'push'
        run: python3 tools/fetch_covers.py --tidy-only
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/covers
          git diff --cached --quiet || git commit -m "Update covers"
          git push
