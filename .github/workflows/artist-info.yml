name: Artist info

# Run by hand from the Actions tab: looks up each act on Wikidata (person or group,
# birth date) for the Ask page's questions, and commits artist_info.json.
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Look up every act again, not just new ones'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_artist_info.py ${{ inputs.all && '--all' || '' }}
      - name: Commit artist info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist_info.json artist_info_missing.txt
          git diff --cached --quiet || git commit -m "Update artist info"
          git push
